html,
body {
  margin: 0;
  background: var(--gravity-color-surface-light-lighter);
  font-family: var(--gravity-font-family-text);
  -webkit-font-smoothing: antialiased;
  /* Node IDs and other dynamic strings can be one long unbroken run (e.g.
     "37:23495;6901:3138;6246:57884") with no natural break point — without
     this, they overflow their container instead of wrapping. Inherited, so
     it reaches every gravity-text's shadow-rendered span too. */
  overflow-wrap: anywhere;
}
.app {
  display: flex;
  flex-direction: column;
  gap: var(--gravity-spacing-normal);
  padding: var(--gravity-spacing-normal);
}
.stack {
  display: flex;
  flex-direction: column;
  gap: var(--gravity-spacing-normal);
}
.stack-tight {
  display: flex;
  flex-direction: column;
  gap: var(--gravity-spacing-x-tight);
}
.stack-xx-tight {
  display: flex;
  flex-direction: column;
  gap: var(--gravity-spacing-xx-tight);
}
.kv-row {
  display: flex;
  align-items: center;
  gap: var(--gravity-spacing-x-tight);
}
.kv-label {
  flex-shrink: 0;
  white-space: nowrap;
}
.kv-value {
  flex: 1;
  min-width: 0;
}
.details {
  border-top: var(--gravity-border-thin) solid var(--gravity-color-glass-dark-10);
  padding-top: var(--gravity-spacing-tight);
}
.stack-none {
  display: flex;
  flex-direction: column;
}
.row-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gravity-spacing-tight);
  min-height: 48px;
  padding: var(--gravity-spacing-x-tight) var(--gravity-spacing-normal);
  background: var(--gravity-color-surface-light-lighter);
  border: var(--gravity-border-thin) solid var(--gravity-color-glass-dark-10);
  border-radius: var(--gravity-radius-medium);
  box-sizing: border-box;
}
/* Flex items default to min-width: auto (their unwrapped content width), so
   without this a long name/label refuses to shrink and pushes the badge on
   the right out of the row instead of wrapping onto a second line. */
.row-card > *:first-child {
  flex: 1 1 auto;
  min-width: 0;
}
.row-card > *:last-child {
  flex-shrink: 0;
}
.nowrap {
  white-space: nowrap;
  overflow-wrap: normal;
}
